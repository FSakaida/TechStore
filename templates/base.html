<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Loja virtual acadêmica desenvolvida com Flask e PostgreSQL.">
    <title>{% block title %}TechStore{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body data-page="{% block page %}{% endblock %}">
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{{ url_for('catalogo') }}" aria-label="Ir para o catálogo">
                <span class="brand-mark">T</span>
                <span>TechStore</span>
            </a>

            <nav class="main-nav" aria-label="Navegação principal">
                <a href="{{ url_for('catalogo') }}">Produtos</a>
                <a class="cart-link" href="{{ url_for('carrinho') }}">
                    Carrinho
                    <span class="cart-count" data-cart-count>0</span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <strong>TechStore</strong>
            <span>Projeto acadêmico de e-commerce</span>
        </div>
    </footer>

    <div class="toast" data-toast role="status" aria-live="polite"></div>
    <script id="products-data" type="application/json">{{ produtos|default([], true)|tojson }}</script>
</body>
</html>
